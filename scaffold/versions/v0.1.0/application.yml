# =====================================================================
# flower-monomer-scaffolding 应用配置（项目根目录）
# @Author: 花海
# @Date: 2026/08/15 14:00
# @Description: 脚手架单体应用配置。配置优先级：环境变量 > .env > 本文件 > 框架默认 application.default.yml。
#               默认形态：MySQL（本地开发 use_ssl=false）+ 内存缓存 + 本地存储 + 内存 MQ + 内存注册中心。
#               数据库连接（ip/端口/库名/账号/密码）全部经 ${ENV:default} 占位符外置，
#               敏感值写入项目根 .env（复制 .env.example），非敏感项缺失时用默认值兜底。
#               生产环境：设置 APP_ENV=prod，并按需切换 redis / minio / rocketmq / nacos。
# =====================================================================
app:
  name: flower-monomer-scaffolding
  env: dev
  version: 0.1.0
  logging:
    level: INFO
    format: text

  web:
    # 中间件声明式引入：列出即引入，enabled: false 显式关闭；
    # trace_id 必须最后声明（最先执行生成 TraceId，避免覆盖内层鉴权注入的身份）
    middlewares:
      security_headers:
        enabled: true            # 安全响应头（推荐启用）
      auth:
        enabled: false           # 统一鉴权中间件，需使用时改为 true 并配置签发密钥 JWT_SECRET_KEY
        whitelist: ["/health", "/health/live", "/health/ready", "/metrics", "/docs", "/redoc", "/openapi.json"]
      trace_id: {}

  # 缓存：memory（无需外部服务）/ redis（生产推荐）
  cache:
    type: memory

  # 数据库：mysql / sqlite（测试与轻量场景可切 sqlite）
  db:
    type: mysql
    mysql:
      # 数据库连接参数全部经 ${ENV:default} 占位符外置（敏感配置不落盘）：
      # 从环境变量/.env 读取（复制 .env.example 为 .env 并填写），缺失时用默认值兜底
      host: ${APP_DB_MYSQL_HOST:127.0.0.1}
      port: ${APP_DB_MYSQL_PORT:3306}
      database: ${APP_DB_MYSQL_DATABASE:flower_monomer}
      username: ${APP_DB_MYSQL_USERNAME:root}
      password: ${APP_DB_MYSQL_PASSWORD:}
      charset: utf8mb4
      use_ssl: false             # 本地开发默认关闭 SSL（无证书）；生产环境开启（use_ssl: true）并配置 ssl_ca
      pool_size: 8
      max_overflow: 8
    # sqlite:
    #   path: ./data/app.db      # 切换 app.db.type=sqlite 时生效（无需外部服务）

  # 对象存储：local / minio
  storage:
    type: local
    base_dir: ./data

  # 消息队列：memory / rocketmq
  mq:
    type: memory

  # 服务注册发现：memory / nacos
  registry:
    type: memory
