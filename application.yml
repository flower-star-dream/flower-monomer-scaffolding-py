# =====================================================================
# flower-monomer-scaffolding 应用配置（项目根目录）
# @Author: 花海
# @Date: 2026/08/15 14:00
# @Description: 脚手架单体应用配置。配置优先级：环境变量 > .env > 本文件 > 框架默认 application.default.yml。
#               组件配置段由脚手架组件选择生成：未选择/关闭的组件整块移除，已选择组件按实现替换
#               （模板内为合法默认值，脚手架自身可直接运行；生成后手动增删组件配置段不影响框架，
#               框架对未配置组件回落内置默认实现）。
#               数据库连接（ip/端口/库名/账号/密码）全部经 ${ENV:default} 占位符外置，
#               敏感值写入项目根 .env（复制 .env.example），非敏感项缺失时用默认值兜底。
#               生产环境：设置 APP_ENV=prod，并按需启用 redis / minio / rocketmq / nacos。
# =====================================================================
app:
  name: flower-monomer-scaffolding
  env: dev
  version: 0.1.0
  logging:
    level: INFO
    format: text

  # 能力依赖装配（框架 2026-08-17）：enabled 声明启用的可选能力，装配时按包含关系校验
  # （缺前置自动补足，如 pay 自动带上 authz/authn/user；未知能力/依赖循环抛错）并自动导入
  # 对应框架模块。由脚手架组件选择生成（如选择支付 -> "pay"、JWT/三方登录 -> "authn"）；
  # 默认不启用任何可选能力（[]），无对应能力的组件不参与。
  capabilities:
    enabled: []

  web:
    # 中间件声明式引入：列出即引入，enabled: false 显式关闭；
    # trace_id 必须最后声明（最先执行生成 TraceId，避免覆盖内层鉴权注入的身份）
    middlewares:
      security_headers:
        enabled: true            # 安全响应头（推荐启用）
      auth:
        enabled: false           # 统一鉴权中间件，需使用时改为 true 并配置签发密钥 JWT_SECRET_KEY
        whitelist: ["/health", "/health/live", "/health/ready", "/metrics", "/capacity", "/docs", "/redoc", "/openapi.json"]
      # <<<COMPONENT:idempotency>>>
      idempotency:               # API 幂等键中间件（防重复提交，规范 §12.6；选择后启用）
        enabled: false           #   memory/redis/custom 选择均已启用；TTL 覆盖重试窗口
        ttl_seconds: 86400       #   多实例需配 Redis 共享存储（application.yml 中 cache.type=redis）
      # <<</COMPONENT:idempotency>>>
      trace_id: {}

  # <<<COMPONENT:db>>>
  # 数据库：mysql（生产推荐）/ sqlite（轻量/测试）；连接参数全部经 ${ENV:default} 占位符外置
  db:
    type: mysql
    mysql:
      host: ${APP_DB_MYSQL_HOST:127.0.0.1}
      port: ${APP_DB_MYSQL_PORT:3306}
      database: ${APP_DB_MYSQL_DATABASE:flower_monomer}
      username: ${APP_DB_MYSQL_USERNAME:root}
      password: ${APP_DB_MYSQL_PASSWORD:}
      charset: utf8mb4
      use_ssl: false             # 本地开发默认关闭 SSL（无证书）；生产环境开启（use_ssl: true）并配置 ssl_ca
      pool_size: 8
      max_overflow: 8
    sqlite:
      path: ./data/app.db        # 切换 db.type=sqlite 时生效（无需外部服务）
  # <<</COMPONENT:db>>>

  # <<<COMPONENT:cache>>>
  # 缓存：memory（无需外部服务，SPI 默认策略）/ redis（生产推荐）/ custom（自研 CacheBackendInterface）
  cache:
    type: memory
    max_size: 10000
    redis:
      host: ${APP_CACHE_REDIS_HOST:127.0.0.1}
      port: ${APP_CACHE_REDIS_PORT:6379}
      db: ${APP_CACHE_REDIS_DB:0}
      password: ${APP_CACHE_REDIS_PASSWORD:}
      username: ${APP_CACHE_REDIS_USERNAME:}
      max_connections: 50
      decode_responses: true
      socket_connect_timeout: 5
      socket_timeout: 5
      socket_keepalive: true
      health_check_interval: 30
      retry_on_timeout: true
  # <<</COMPONENT:cache>>>

  # <<<COMPONENT:storage>>>
  # 对象存储：local（本地磁盘，SPI 默认策略）/ minio（生产推荐）/ custom（自研 ObjectStorageInterface）
  storage:
    type: local
    base_dir: ./data
    minio:
      endpoint: ${APP_STORAGE_MINIO_ENDPOINT:localhost:9000}
      access_key: ${APP_STORAGE_MINIO_ACCESS_KEY:}
      secret_key: ${APP_STORAGE_MINIO_SECRET_KEY:}
      secure: false
      default_bucket: default
      presign_expires: 600
  # <<</COMPONENT:storage>>>

  # <<<COMPONENT:mq>>>
  # 消息队列：memory（进程内队列，SPI 默认策略）/ rocketmq（生产推荐）/ custom（自研发布/消费/幂等 SPI）
  mq:
    type: memory
    rocketmq:
      name_server: ${APP_MQ_ROCKETMQ_NAMESERVER:127.0.0.1:9876}
      group_name: web-producer-group
      send_timeout: 3000
    # Outbox 可靠投递（规范 §21.3）：事件先入本地事务表再投递；由 register_outbox_tasks 显式装配
    outbox:
      enabled: false
      max_retry: 3
      retry_backoff_seconds: 30
      dead_letter_topic: web-dlq-topic
      publish_interval_seconds: 5
      cleanup_interval_seconds: 3600
      retain_days: 7
  # <<</COMPONENT:mq>>>

  # <<<COMPONENT:registry>>>
  # 服务注册发现：nacos（生产推荐；注册中心不允许启用内存实现）/ custom（自研 ServiceRegistryInterface）
  registry:
    type: nacos
    expire_seconds: 15
    nacos:
      server_addresses: ${APP_REGISTRY_NACOS_SERVER:127.0.0.1:8848}
      namespace: ${APP_REGISTRY_NACOS_NAMESPACE:public}
      group: ${APP_REGISTRY_NACOS_GROUP:DEFAULT_GROUP}
      cluster: DEFAULT
      # 认证（敏感配置经 ${ENV:default} 注入，建议写入 .env）：
      # username: ${APP_REGISTRY_NACOS_USERNAME:nacos}
      # password: ${APP_REGISTRY_NACOS_PASSWORD:}
      # access_key: ${APP_REGISTRY_NACOS_ACCESS_KEY:}
      # secret_key: ${APP_REGISTRY_NACOS_SECRET_KEY:}
      # 配置中心（config 组件）与注册中心复用同一 Nacos 客户端，启用配置中心时加：
      # config_enabled: true
      # data_id: ${APP_CONFIG_NACOS_DATA_ID:}
  # <<</COMPONENT:registry>>>

  # <<<COMPONENT:config>>>
  # 配置中心（ConfigClientInterface / ConfigSourceInterface）：默认本地复合配置源；
  # 生产接入 Nacos 配置中心复用 registry.nacos（加 config_enabled: true + data_id），
  # 自定义实现见 src/<package>/spi/config_custom.py（需安装 nacos extras）。
  # <<</COMPONENT:config>>>

  # <<<COMPONENT:mongo>>>
  # MongoDB（默认不启用；选择后启用，填写连接信息，需安装 mongo extras）
  mongo:
    enabled: false
    url: ${APP_MONGO_URL:mongodb://localhost:27017}
    database: ${APP_MONGO_DATABASE:app}
    username: ${APP_MONGO_USERNAME:}
    password: ${APP_MONGO_PASSWORD:}
    max_pool_size: 50
    min_pool_size: 10
    max_idle_time_ms: 600000
    connect_timeout_ms: 10000
    server_selection_timeout_ms: 30000
    socket_timeout_ms: 60000
    wait_queue_timeout_ms: 10000
    heartbeat_frequency_ms: 10000
    retry_writes: true
  # <<</COMPONENT:mongo>>>

  # <<<COMPONENT:payment>>>
  # 支付（payment）：memory（内存测试渠道，SPI 默认策略）/ wechat（微信支付 APIv3，生产）/
  # custom（自研 PaymentGateway / PaymentCallbackVerifier）
  payment:
    type: memory
    wechat:
      appid: ${APP_PAYMENT_WECHAT_APPID:}
      mchid: ${APP_PAYMENT_WECHAT_MCHID:}
      mch_serial_no: ${APP_PAYMENT_WECHAT_MCH_SERIAL_NO:}
      api_v3_key: ${APP_PAYMENT_WECHAT_API_V3_KEY:}
      private_key: ${APP_PAYMENT_WECHAT_PRIVATE_KEY:}
      private_key_path: ${APP_PAYMENT_WECHAT_PRIVATE_KEY_PATH:}
      notify_url: ${APP_PAYMENT_WECHAT_NOTIFY_URL:}
      refund_notify_url: ${APP_PAYMENT_WECHAT_REFUND_NOTIFY_URL:}
      verify_mode: platform_cert
      platform_cert_dir: ./cert
      cert_auto_download: false
      public_key_id: ${APP_PAYMENT_WECHAT_PUBLIC_KEY_ID:}
      public_key: ${APP_PAYMENT_WECHAT_PUBLIC_KEY:}
      connect_timeout: 5
      read_timeout: 30
  # <<</COMPONENT:payment>>>

  # <<<COMPONENT:ai>>>
  # AI 与大模型（默认不启用；选择后启用，配置模型清单 ai.models，api_key 仅存 env:VAR 引用，
  # 真实密钥经环境变量注入，禁止明文落盘）
  ai:
    enabled: false
    store:
      type: yml
    models: []
    model_gateway:
      default_scene: ""
      routes: {}
    connection_pool:
      stream_max_connections: 16
      stream_max_keepalive_connections: 16
      sync_max_connections: 64
      sync_max_keepalive_connections: 32
      connect_timeout_seconds: 1.0
      stream_read_timeout_seconds: 30.0
      sync_read_timeout_seconds: 60.0
    quota:
      max_calls: 0
      max_tokens: 0
      max_cost: 0.0
      window_seconds: 3600
  # <<</COMPONENT:ai>>>
