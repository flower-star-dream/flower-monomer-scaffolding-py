# =====================================================================
# flower-monomer-scaffolding CI/CD（GitHub Actions）
# @Author: 花海
# @Date: 2026/08/16 10:00
# @Description: 推送 main / 版本 tag / PR 时执行：
#               test      静态类型检查（pyright）+ 单元测试（pytest 硬性门禁）
#               build-image 拉取框架基础镜像（GHCR）→ 构建业务镜像 → Trivy 扫描 → /health/live 冒烟 → 推送 GHCR
#               镜像推送：push main 推测试标签 <分支名>-<时间戳>-<构建号> + latest；版本 tag v* 推 SemVer + latest；
#               PR 只构建/扫描/冒烟、不推送（详见 docs/CI-CD.md）。
# 前置条件（跨仓库访问，详见 docs/CI-CD.md §1.2）：
#   1) 框架仓库 flower-star-dream/flower-web-infrastructure 需可被本工作流检出（仓库公开，或配置
#      PAT 存为 Secrets 并将下方 checkout 的 token 指向它）；框架依赖以本地 editable 方式安装。
#   2) ghcr.io/flower-star-dream/flower-web-infrastructure:latest 需对本仓库可拉取（框架镜像包设置
#      "Manage Actions access" 授权本仓库，或本仓库配置带 read:packages 的 PAT 用于 GHCR 登录）。
# =====================================================================
name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]          # 版本 tag 无条件触发：发布正式版镜像，不受 paths-ignore 影响
    paths-ignore:         # 仅文档/非代码变更不触发（不参与单元测试与镜像构建）
      - "*.md"
      - "docs/**"
      - "LICENSE"
      - ".gitignore"
      - ".env.example"
      - "db/**"
      - "data/**"
  pull_request:
    paths-ignore:
      - "*.md"
      - "docs/**"
      - "LICENSE"
      - ".gitignore"
      - ".env.example"
      - "db/**"
      - "data/**"

jobs:
  test:
    name: 静态检查 + 单元测试
    runs-on: ubuntu-latest
    steps:
      - name: 检出脚手架
        uses: actions/checkout@v4

      - name: 检出框架仓库（本地 editable 依赖方式）
        uses: actions/checkout@v4
        with:
          repository: flower-star-dream/flower-web-infrastructure
          path: flower-web-infrastructure
          # 框架仓库为私有时需配置 PAT（Secrets.FRAMEWORK_PAT，contents:read）并取消下方注释；
          # 仓库公开时无需 token
          # token: ${{ secrets.FRAMEWORK_PAT }}

      - name: 安装 Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: 安装框架依赖（editable）
        run: pip install -e ./flower-web-infrastructure[mysql,redis,migrate]

      - name: 安装脚手架依赖（dev）
        run: pip install -e ".[dev]"

      - name: 静态类型检查（pyright）
        run: pyright

      - name: 单元测试（pytest）
        run: pytest -q

  build-image:
    name: 构建 Docker 业务镜像
    runs-on: ubuntu-latest
    needs: test
    # GHCR 推送所需权限（GITHUB_TOKEN 写包权限）
    permissions:
      contents: read
      packages: write
    steps:
      - name: 检出脚手架
        uses: actions/checkout@v4

      - name: 登录 GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 拉取框架基础镜像
        # 业务镜像 Dockerfile 固定 FROM flower-web-infrastructure:latest，
        # 从 GHCR 拉取框架镜像并打本地标签，使 Dockerfile 的 FROM 可解析；
        # 框架镜像包需对本仓库授权拉取（包设置 "Manage Actions access"），否则改用带 read:packages 的 PAT
        run: |
          docker pull ghcr.io/flower-star-dream/flower-web-infrastructure:latest
          docker tag ghcr.io/flower-star-dream/flower-web-infrastructure:latest flower-web-infrastructure:latest

      - name: 构建业务镜像
        run: docker build -t flower-monomer-scaffolding:ci .

      - name: 镜像漏洞扫描（Trivy，高危/严重阻断上线）
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: flower-monomer-scaffolding:ci
          format: table
          exit-code: "1"          # 存在高危/严重漏洞即失败（阻断）
          severity: HIGH,CRITICAL
          ignore-unfixed: true    # 忽略无修复版本的漏洞，避免无解阻断

      - name: 镜像冒烟验证（/health/live 存活可达）
        # 存活探针 /health/live 仅校验进程存活、不探测依赖（整改 S19-1）；
        # 就绪探针 /health/ready 由编排层（K8s readinessProbe）使用
        run: |
          docker run -d --name scaffold-smoke -p 18001:8000 flower-monomer-scaffolding:ci
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:18001/health/live > /dev/null 2>&1; then
              echo "health check passed"; exit 0
            fi
            sleep 1
          done
          docker logs scaffold-smoke || true
          echo "health check failed" >&2
          exit 1

      - name: 推送镜像（main 分支：测试标签 + latest）
        # 整改 S20-3 标签规范：测试版 <分支名>-<时间戳>-<构建号>（如 main-20260816103000-42）；
        # latest 跟随最新 main 构建
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          IMAGE=ghcr.io/${{ github.repository }}
          docker tag flower-monomer-scaffolding:ci $IMAGE:main-$(date +%Y%m%d%H%M%S)-${{ github.run_number }}
          docker push $IMAGE:main-$(date +%Y%m%d%H%M%S)-${{ github.run_number }}
          docker tag flower-monomer-scaffolding:ci $IMAGE:latest
          docker push $IMAGE:latest

      - name: 推送镜像（版本 tag v*：SemVer + latest）
        # 正式版：语义化版本（与 pyproject.toml 版本号保持一致），同时更新 latest
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          IMAGE=ghcr.io/${{ github.repository }}
          VERSION=${GITHUB_REF#refs/tags/v}
          docker tag flower-monomer-scaffolding:ci $IMAGE:$VERSION
          docker push $IMAGE:$VERSION
          docker tag flower-monomer-scaffolding:ci $IMAGE:latest
          docker push $IMAGE:latest
