[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "flower-monomer-scaffolding"
version = "0.1.0"
description = "基于 flower-web-infrastructure 的单体应用脚手架（可快速复制的业务项目模板）"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "花海" }]
license = { text = "MIT" }
keywords = ["web", "backend", "fastapi", "scaffolding", "monolith"]

# =====================================================================
# 框架依赖（flower-web-infrastructure）安装方式（默认远程拉取，不假设本机有框架仓库）：
#   方式一（Git 依赖，默认）：在脚手架虚拟环境内执行
#     pip install "flower-web-infrastructure[mysql,redis,migrate] @ git+https://github.com/flower-star-dream/flower-web-infrastructure.git"
#     固定版本可在 URL 末尾加 @v<版本>（如 @v0.2.0）；框架仓库为私有时需配置凭据。
#   方式二（本地开发，可选）：本机已 clone 框架仓库时，可用 editable 本地安装
#     pip install -e "f:\baseProject\flower-web-infrastructure[mysql,redis,migrate]"
# 说明：脚手架业务代码通过 `from web_infra import ...` 使用框架能力，
#       框架为基础依赖（由上述命令安装），此处不再重复声明。
# =====================================================================
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "pyright>=1.1.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "auto"

[tool.pyright]
# 静态类型检查：新增代码必须 0 错误
pythonVersion = "3.10"
pythonPlatform = "All"
typeCheckingMode = "standard"
include = ["src"]
venvPath = "."
venv = ".venv"
reportMissingTypeStubs = "none"
